<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lionn — Night Prowler · Prototype 01</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-deep: #07060f;
      --bg-mid: #14091f;
      --indigo: #1a0d2a;
      --violet: #9b59ff;
      --violet-dim: #6b3fb8;
      --gold: #d4af37;
      --parchment: #d4c5a5;
      --muted: #5a4a78;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background:
        radial-gradient(ellipse at top, rgba(155, 89, 255, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at bottom, rgba(155, 89, 255, 0.05) 0%, transparent 50%),
        linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-mid) 50%, var(--bg-deep) 100%);
      color: var(--parchment);
      font-family: 'Cinzel', 'Trajan Pro', Georgia, serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .crest {
      text-align: center;
      padding-top: 28px;
      font-size: 3rem;
      color: var(--gold);
      filter: drop-shadow(0 0 18px rgba(155, 89, 255, 0.45));
      letter-spacing: 0;
    }
    .title {
      text-align: center;
      font-family: 'Cinzel', serif;
      font-weight: 900;
      font-size: clamp(2.4rem, 8vw, 5rem);
      letter-spacing: 0.32em;
      color: var(--parchment);
      text-shadow:
        0 0 30px rgba(155, 89, 255, 0.55),
        0 0 60px rgba(155, 89, 255, 0.25);
      margin: 6px 0 0;
      line-height: 1;
    }
    .subtitle {
      text-align: center;
      font-family: 'Cinzel', serif;
      font-weight: 500;
      font-size: clamp(0.85rem, 1.6vw, 1.15rem);
      color: var(--violet);
      letter-spacing: 0.7em;
      padding-left: 0.7em; /* compensate for letter-spacing */
      margin: 6px 0 22px;
      text-transform: uppercase;
    }

    .scene-wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 16px;
    }
    .scene {
      position: relative;
      width: 100%;
      aspect-ratio: 1.62 / 1;
      overflow: hidden;
      border-radius: 4px;
      border: 1px solid rgba(212, 175, 55, 0.25);
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.6) inset,
        0 0 80px rgba(155, 89, 255, 0.15),
        0 25px 50px rgba(0, 0, 0, 0.6);
      background: #000;
    }
    .backdrop {
      position: absolute;
      inset: 0;
      background-image: url('assets/backgrounds/courtyard/frames/backdrop_silhouettes_000.png');
      background-size: cover;
      background-position: center 70%;
      filter: brightness(0.92) saturate(1.1);
    }
    .vignette {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 80%, transparent 30%, rgba(0,0,0,0.55) 100%),
        radial-gradient(ellipse at 50% 0%, rgba(155, 89, 255, 0.18) 0%, transparent 60%);
      pointer-events: none;
    }
    .moonlight {
      position: absolute;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 60%;
      height: 80%;
      background: radial-gradient(ellipse, rgba(180, 200, 255, 0.18) 0%, transparent 60%);
      pointer-events: none;
      mix-blend-mode: screen;
    }
    .fog {
      position: absolute;
      left: -100%;
      bottom: 8%;
      width: 300%;
      height: 28%;
      background-image: url('assets/backgrounds/courtyard/frames/fog_mist_strip_000.png');
      background-size: 33.333% 100%;
      background-repeat: repeat-x;
      opacity: 0.45;
      animation: drift 38s linear infinite;
      mix-blend-mode: screen;
      pointer-events: none;
    }
    @keyframes drift {
      from { transform: translateX(0); }
      to   { transform: translateX(33.333%); }
    }

    .lionn {
      position: absolute;
      bottom: 8%;
      left: 50%;
      transform: translate(-50%, 0);
      height: 62%;
      max-height: 62%;
      width: auto;
      filter:
        drop-shadow(0 8px 18px rgba(0, 0, 0, 0.7))
        drop-shadow(0 0 30px rgba(155, 89, 255, 0.22));
      animation: breathe 3.6s ease-in-out infinite;
      pointer-events: none;
      image-rendering: -webkit-optimize-contrast;
      will-change: transform;
    }
    @keyframes breathe {
      0%, 100% { transform: translate(-50%, 0) scale(1); }
      50%      { transform: translate(-50%, -1.2%) scale(1.01); }
    }
    .lionn.pop {
      animation: pop 0.42s ease-out forwards, breathe 3.6s ease-in-out 0.42s infinite;
    }
    @keyframes pop {
      0%   { transform: translate(-50%, 2%) scale(0.9);  opacity: 0; filter: drop-shadow(0 0 70px rgba(155, 89, 255, 0.95)); }
      45%  { opacity: 1; }
      100% { transform: translate(-50%, 0)  scale(1);    opacity: 1; filter: drop-shadow(0 8px 18px rgba(0,0,0,0.7)) drop-shadow(0 0 30px rgba(155, 89, 255, 0.22)); }
    }

    .moves {
      max-width: 1200px;
      margin: 28px auto 8px;
      padding: 0 16px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 14px;
    }
    .move-btn {
      position: relative;
      background:
        linear-gradient(180deg, rgba(26, 13, 42, 0.85) 0%, rgba(7, 6, 15, 0.95) 100%);
      border: 1px solid rgba(58, 42, 85, 0.9);
      border-radius: 6px;
      padding: 10px 8px 8px;
      color: var(--parchment);
      cursor: pointer;
      text-align: center;
      transition:
        border-color 0.18s ease,
        transform 0.12s ease,
        box-shadow 0.18s ease,
        background 0.18s ease;
      font-family: 'Cinzel', serif;
      font-weight: 500;
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    .move-btn:hover {
      border-color: var(--violet);
      box-shadow: 0 0 22px rgba(155, 89, 255, 0.32);
      transform: translateY(-2px);
    }
    .move-btn.active {
      border-color: var(--gold);
      background:
        linear-gradient(180deg, rgba(42, 28, 61, 0.95) 0%, rgba(20, 9, 31, 0.95) 100%);
      box-shadow: 0 0 28px rgba(212, 175, 55, 0.35);
      color: var(--gold);
    }
    .move-btn .thumb {
      width: 100%;
      height: 84px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      margin-bottom: 8px;
    }
    .move-btn .thumb img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.6));
    }
    .move-btn .num {
      position: absolute;
      top: 6px;
      left: 8px;
      font-size: 0.7rem;
      color: var(--violet-dim);
      font-weight: 700;
    }

    .footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.72rem;
      padding: 20px 16px 30px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
    }
    .footer .tip { color: var(--violet); }

    @media (max-width: 600px) {
      .subtitle { letter-spacing: 0.45em; padding-left: 0.45em; }
      .move-btn .thumb { height: 64px; }
      .move-btn { font-size: 0.7rem; }
    }
  </style>
</head>
<body>
  <div class="crest">⚜</div>
  <h1 class="title">LIONN</h1>
  <p class="subtitle">Night Prowler</p>

  <div class="scene-wrap">
    <div class="scene" id="scene">
      <div class="moonlight"></div>
      <div class="backdrop"></div>
      <div class="fog"></div>
      <div class="vignette"></div>
      <img id="lionn" class="lionn" src="assets/sprites/lionn/frames/idle_000.png" alt="Lionn" />
    </div>
  </div>

  <div class="moves" id="moves">
    <button class="move-btn active" data-pose="idle"          data-num="1">
      <span class="num">1</span>
      <span class="thumb"><img src="assets/sprites/lionn/frames/idle_000.png" alt="" /></span>
      Idle
    </button>
    <button class="move-btn" data-pose="run"                  data-num="2">
      <span class="num">2</span>
      <span class="thumb"><img src="assets/sprites/lionn/frames/run_000.png" alt="" /></span>
      Run
    </button>
    <button class="move-btn" data-pose="crouch"               data-num="3">
      <span class="num">3</span>
      <span class="thumb"><img src="assets/sprites/lionn/frames/crouch_000.png" alt="" /></span>
      Crouch
    </button>
    <button class="move-btn" data-pose="jump"                 data-num="4">
      <span class="num">4</span>
      <span class="thumb"><img src="assets/sprites/lionn/frames/jump_000.png" alt="" /></span>
      Jump
    </button>
    <button class="move-btn" data-pose="claw_combo"           data-num="5">
      <span class="num">5</span>
      <span class="thumb"><img src="assets/sprites/lionn/frames/claw_combo_000.png" alt="" /></span>
      Claw Combo
    </button>
    <button class="move-btn" data-pose="shadow_dash"          data-num="6">
      <span class="num">6</span>
      <span class="thumb"><img src="assets/sprites/lionn/frames/shadow_dash_000.png" alt="" /></span>
      Shadow Dash
    </button>
    <button class="move-btn" data-pose="shadow_pounce"        data-num="7">
      <span class="num">7</span>
      <span class="thumb"><img src="assets/sprites/lionn/frames/shadow_pounce_000.png" alt="" /></span>
      Shadow Pounce
    </button>
    <button class="move-btn" data-pose="wall_cling"           data-num="8">
      <span class="num">8</span>
      <span class="thumb"><img src="assets/sprites/lionn/frames/wall_cling_000.png" alt="" /></span>
      Wall Cling
    </button>
  </div>

  <div class="footer">
    Prototype 01 · The Ruined Lion Courtyard ·
    <span class="tip">tap a move or press 1–8</span>
  </div>

  <script>
    const lionn = document.getElementById('lionn');
    const buttons = document.querySelectorAll('.move-btn');
    const ASSET_BASE = 'assets/sprites/lionn/frames/';
    const POSES = {
      idle:          ['idle_000.png'],
      run:           ['run_000.png'],
      crouch:        ['crouch_000.png'],
      jump:          ['jump_000.png'],
      claw_combo:    ['claw_combo_000.png', 'claw_combo_001.png', 'claw_combo_002.png'],
      shadow_dash:   ['shadow_dash_000.png'],
      shadow_pounce: ['shadow_pounce_000.png'],
      wall_cling:    ['wall_cling_000.png'],
    };
    const FPS = { claw_combo: 4 };

    let cycleTimer = null;

    function setPose(name) {
      clearTimeout(cycleTimer);
      buttons.forEach(b => b.classList.toggle('active', b.dataset.pose === name));

      // restart pop animation
      lionn.classList.remove('pop');
      void lionn.offsetWidth;
      lionn.classList.add('pop');

      const frames = POSES[name];
      lionn.src = ASSET_BASE + frames[0];

      if (frames.length > 1) {
        const fps = FPS[name] || 6;
        const periodMs = 1000 / fps;
        let i = 1;
        const tick = () => {
          lionn.src = ASSET_BASE + frames[i % frames.length];
          i++;
          cycleTimer = setTimeout(tick, periodMs);
        };
        cycleTimer = setTimeout(tick, periodMs);
      }
    }

    buttons.forEach(b => b.addEventListener('click', () => setPose(b.dataset.pose)));

    // 1–8 keyboard
    const order = ['idle', 'run', 'crouch', 'jump', 'claw_combo', 'shadow_dash', 'shadow_pounce', 'wall_cling'];
    document.addEventListener('keydown', (e) => {
      const i = parseInt(e.key, 10) - 1;
      if (i >= 0 && i < order.length) setPose(order[i]);
    });

    // preload all frames so swaps are instant
    Object.values(POSES).flat().forEach(f => {
      const img = new Image();
      img.src = ASSET_BASE + f;
    });
  </script>
</body>
</html>
